version: '3'
services:
  lpr-app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DRISHTI_COOKIE_SECURE: ${DRISHTI_COOKIE_SECURE:-false}
      DRISHTI_DEMO_MODE: ${DRISHTI_DEMO_MODE:-false}
      DRISHTI_SESSION_SECRET: ${DRISHTI_SESSION_SECRET:-}
      DRISHTI_SUBSCRIPTION_DB: /app/data/subscriptions.sqlite3
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_PLAN_ID: ${RAZORPAY_PLAN_ID:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    volumes:
      - subscription-data:/app/data

volumes:
  subscription-data: